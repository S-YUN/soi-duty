include: package:flutter_lints/flutter.yaml

# riverpod_lint는 pubspec이 아니라 여기서 설치한다 (analysis_server_plugin 방식).
plugins:
  riverpod_lint: ^3.1.9

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - build/**
    - android/**
    - ios/**

linter:
  rules:
    prefer_single_quotes: true

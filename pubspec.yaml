name: soi_duty
description: "주 40시간 유연근무 기준 근무시간 기록 앱. 잔여 시간을 보여준다."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 상태관리 + DI (Riverpod 코드젠)
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

  # 모델
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # 로컬 저장 (SQLite)
  drift: ^2.35.0
  drift_flutter: ^0.3.1

  # 라우팅
  go_router: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # 코드 생성
  build_runner: ^2.16.1
  riverpod_generator: ^4.0.9
  freezed: ^4.0.1
  json_serializable: ^6.14.1
  drift_dev: ^2.35.0

  # 앱 아이콘 생성: dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.4
  # flavor 생성: dart run flutter_flavorizr (dev/prod 번들 ID·앱 이름만 분리)
  flutter_flavorizr: ^2.6.0
  flutter_driver:
    sdk: flutter
  test: ^1.31.1
  # 네이티브 스플래시 생성: dart run flutter_native_splash:create
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/splash/

  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600

# 네이티브 스플래시 생성: dart run flutter_native_splash:create
# 배경·로고를 인앱 SplashGate와 똑같이 맞춰 첫 프레임까지 이어져 보이게 한다 (핸드오프 3 스플래시).
flutter_native_splash:
  color: "#1B473A"
  image: assets/splash/logo.png # 756px = 3x 기준 폭 252
  ios_content_mode: center
  android_gravity: center
  android_12:
    color: "#1B473A"
    image: assets/splash/mark_android12.png # 원형 마스크라 워드마크 없는 마크만

# 아이콘 원본은 assets/icon/ (핸드오프 규칙: #1B473A 배경 + 투명 로고 78%).
# Android adaptive 전경은 원형 마스크 안전 영역 때문에 62%로 따로 합성했다.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#1B473A"
  adaptive_icon_foreground: assets/icon/icon_adaptive_fg.png
  remove_alpha_ios: true

# 실사용(prod)과 테스트(dev) 앱을 폰에 나란히 설치하기 위한 flavor. 코드는 동일, ID·이름만 다르다.
flavorizr:
  app:
    android:
      flavorDimensions: "env"
    ios: {}
  flavors:
    dev:
      app:
        name: "소이듀티 dev"
      android:
        applicationId: "com.nuyoes.soiduty.dev"
      ios:
        bundleId: "com.nuyoes.soiduty.dev"
    prod:
      app:
        name: "소이듀티"
      android:
        applicationId: "com.nuyoes.soiduty"
      ios:
        bundleId: "com.nuyoes.soiduty"
  instructions:
    - android:androidManifest
    - android:buildGradle
    - android:flavorizrGradle
    - ios:xcconfig
    - ios:buildTargets
    - ios:schema
    - ios:plist

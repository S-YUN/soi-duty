name: soi_duty
description: "주 40시간 유연근무 기준 근무시간 기록 앱. 잔여 시간을 보여준다."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 상태관리 + DI (Riverpod 코드젠)
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

  # 모델
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # 로컬 저장 (SQLite)
  drift: ^2.35.0
  drift_flutter: ^0.3.1

  # 라우팅
  go_router: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # 코드 생성
  build_runner: ^2.16.1
  riverpod_generator: ^4.0.9
  freezed: ^4.0.1
  json_serializable: ^6.14.1
  drift_dev: ^2.35.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  # 폰트 파일이 들어오면 여기에 등록한다.
  # fonts:
  #   - family: Pretendard
  #     fonts:
  #       - asset: assets/fonts/Pretendard-Regular.otf
  #       - asset: assets/fonts/Pretendard-Bold.otf
  #         weight: 700
